name: Waka Readme

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WAKATIME_API_KEY: ""
          SHOW_COMMIT: True
          SHOW_DAYS_OF_WEEK: True
          SHOW_TOTAL_CODE_TIME: False
